name: platform_health_plugin
description: |
  Operator/CI diagnostic gate. Iterates the live process registry and
  invokes every registered @platform_process and @service_interface_process
  with sentinel arguments to surface registration, schema, and SQL type
  errors that unit smokes (which match SQL strings without executing them)
  cannot catch.

  Read-shape calls (list_*, get_*, list_active_*) execute LIVE against the
  bound state_service. Write-shape calls are skipped unless write_enabled=True
  is passed. NOT a startup-blocking gate — manual operator/CI invocation
  via `plugin::platform_health_plugin::execute_registry_sweep`.

  Catches the failure modes that bit the platform 2026-05-28..30:
  D5 EDGE-wake schema mismatch; scheduling_service::execute_in_seconds
  "Process not found or malformed in registry"; session_ledger SQL
  "operator does not exist: integer = boolean".

optional: true

implements:
  - interface: EdgeProcessProvider
