name: jira_plugin
description: >
  Jira Cloud connector with multiple site bindings, API tokens and Atlassian
  OAuth 2.0 (3LO). Legacy issue/JQL/comment/transition/attachment verbs and
  complete typed projects, boards, sprints, backlog/ranking, versions and
  worklogs families include writes and deletes under vendor permissions.
  Every verb accepts an optional bound site selector and names its site.
  Credentials remain vaulted; the original jira_site address-book binding is
  retained as legacy. New sites are explicitly bound, never arbitrary per-call
  request origins. This plugin never accesses the platform state database.
optional: true

implements:
  - interface: EdgeProcessProvider

config:
  token_expiry_warn_days:
    type: integer
    required: false
    default: 14
    description: >
      Emit a loud jira.token_expiring warning when the API token's recorded
      expires_at is within this many days. Never mints or rotates the token
      (the plugin cannot); rotation is an operator runbook.
  request_timeout_seconds:
    type: number
    required: false
    default: 30
    description: >
      Per-request HTTP timeout for the Jira client, bounding hung calls.

  oauth_state_ttl_seconds:
    type: integer
    required: false
    default: 600
    description: Pending OAuth consent lifetime in seconds.
  token_refresh_skew_seconds:
    type: integer
    required: false
    default: 60
    description: Refresh an OAuth access token this many seconds before expiry.

# The legacy jira_site credentials remain chain-consumed from the address book.
# Additional site credentials, index and pending OAuth state use plugin-owned
# vault keys, declared by get_declared_vault_keys. No raw credential process
# parameters and no changes to the vault service contract.
