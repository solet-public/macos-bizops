[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ananta"
# Must be > 1.3.9 (external PyPI 'ananta' package) to avoid conflicts.
version = "2.0.0"
description = "A flexible framework for AI-driven applications"
license = "Apache-2.0"
requires-python = "==3.13.*"
dependencies = [
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "click>=8.0.0",
    "solet-setup-contracts",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "pynacl>=1.5",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
# These back the commit gate itself and must remain required when that gate runs.
# Do not harmonize this group with code_vetting_plugin's optional typecheck/coverage extras.
gate = [
    "ruff>=0.15",
    "pyright>=1.1",
    "radon>=6.0",
]

[project.scripts]
ananta = "ananta.cli:sync_main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start lenient, tighten later
ignore_missing_imports = true
show_error_codes = true

[tool.vulture]
min_confidence = 80
paths = ["src/ananta"]
