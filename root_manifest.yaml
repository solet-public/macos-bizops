# Root manifest — per-homunculus declarative root-strictness contract.
#
# Source of truth for what is allowed at the repo root.  Three consumers
# read it, with explicit blocking semantics per layer:
#
#   1. .githooks/pre-commit             BLOCKING (drift refused at commit)
#   2. restart_with_manifest cutover    BLOCKING (drift refused at cutover)
#   3. ananta.cli startup diagnostic    NEVER BLOCKING (structured log only)
#
# Architectural lock 2026-06-15 PT + operator Q&A locks 2026-06-16 PT
# (Phase A planning §10 + Cycle 10 design memo
# workbench/2026-06-16_root_manifest_yaml_design.md).

schema_version: 1
homunculus_name: dax

universal:
  files:
    - CLAUDE.md
    - README.md
    - LICENSE
    - NOTICE
    - CONTRIBUTING.md
    - root_manifest.yaml
    - bootstrap.py
  directories:
    - ananta
    - plugins
    - knowledge_bases
    - profile
    - quality_gates
    - .claude

platform_managed:
  directories:
    - .git
    - .venv
    - __pycache__
    - .ruff_cache
    - .mypy_cache
    - .pytest_cache
    - .idea

sanctioned:
  - path: PROVENANCE.json
    reason: "genesis provenance record — written at birth, not in seed"
    operator_approved: "2026-07-22"

  - path: client
    reason: "hydration-generated client launchers and fleet functions — written post-genesis"
    operator_approved: "2026-07-22"

  - path: .gitignore
    reason: "not shipped by seed; added by operator or tooling as needed"
    operator_approved: "2026-07-22"

  - path: .dockerignore
    reason: "not shipped by seed; relevant only for container deployments"
    operator_approved: "2026-07-22"

  - path: .mcp.json
    reason: "not shipped by seed; added when MCP bridge is registered"
    operator_approved: "2026-07-22"

  - path: AGENTS.md
    reason: "not shipped by seed; symlink to CLAUDE.md added by operator workflow"
    operator_approved: "2026-07-22"

  - path: pyproject.toml
    reason: "not shipped by seed; added if repo-level packaging is needed"
    operator_approved: "2026-07-22"

  - path: binary_libraries
    reason: "not shipped by seed; created only when native binary plugins are added"
    operator_approved: "2026-07-22"

  - path: workbench
    reason: "not shipped by seed; scratch/research directory created on first use"
    operator_approved: "2026-07-22"

  - path: .githooks
    reason: "not shipped by seed; added if pre-commit hooks are configured"
    operator_approved: "2026-07-22"

  - path: disabled_plugins
    reason: "operator-sanctioned plugin retirement holding pen; not drift"
    operator_approved: "2026-06-15"

  - path: deployment
    reason: "in-transition during 2026-06-15+ verb-conversion; will empty out per Phase F migration"
    operator_approved: "2026-06-15"
    sunset_target: "Phase F-3 + F-4 close"

  - path: initialization
    reason: "F4 retirement workstream; folds into ananta/src/ananta/profile_loader/"
    operator_approved: "2026-06-16"
    sunset_target: "F4 retirement closes"

overrides: []

diagnostic:
  report_categories:
    - unknown_root_entries
    - missing_universal_entries
    - sunset_overdue
    - cleanup_overdue
  ignore_patterns:
    - "*.swp"
    - "*.bak"
    - ".DS_Store"
    - "Thumbs.db"
