# Issue chooser configuration for the seed's upstream feedback channel.
#
# blank_issues_enabled: false is deliberate. The forms carry the evidence
# discipline and the content gate; a blank issue carries neither, and the
# evidence a blank issue omits is exactly what costs a round-trip. Every
# item class an adopter can send has a form below — including the round
# parent, which would otherwise be unfileable with blank issues disabled.
blank_issues_enabled: false

contact_links:
  - name: Design proposal (RFC-shaped) — send a pull request, not an issue
    url: https://github.com/solet-public/macos-bizops/blob/main/plugins/github_midwife_plugin/knowledge_base/07_upstream_feedback_runbook.md
    about: >-
      A worked-through design with alternatives considered and a recommendation
      is a document, not a form field. Write it under workbench/ in your clone
      and open a pull request carrying it. Your local copy of the upstream
      feedback runbook has the branch naming and the full procedure. If you are
      unsure whether you have a design offer or a feature request, file the
      feature request form — a maintainer can ask you to promote it.
